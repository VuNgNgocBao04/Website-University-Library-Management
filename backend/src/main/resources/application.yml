server:
  port: ${PORT:8080}
  tomcat:
    # Drain modest oversized uploads so clients can receive the JSON 413 response.
    max-swallow-size: 10MB
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/library?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:library}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
library:
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:5173}
  mail-from: ${MAIL_FROM:library@localhost}
  upload-dir: ${UPLOAD_DIR:uploads}
  pdf-font: ${PDF_FONT:}
  reminder-days: ${REMINDER_DAYS:3}
  demo-password: ${DEMO_PASSWORD:}
